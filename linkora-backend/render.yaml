services:
  - type: web
    name: linkora-download-api
    runtime: docker
    plan: free
    rootDir: linkora-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LINKORA_API_KEY
        sync: false
      - key: LINKORA_ALLOWED_ORIGINS
        sync: false
      - key: MAX_FILE_BYTES
        value: "524288000"
      - key: MAX_ACTIVE_JOBS
        value: "2"
      - key: DOWNLOAD_DIR
        value: /tmp/linkora-downloads
