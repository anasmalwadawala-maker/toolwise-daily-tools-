name: LINKORA backend checks

on:
  push:
    branches:
      - linkora/metube-style-backend
      - linkora/metube-feature-parity
  pull_request:
    paths:
      - "linkora-backend/**"
      - ".github/workflows/linkora-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linkora-backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q linkora-backend/app
      - name: Run security tests
        run: python -m unittest discover -s linkora-backend/tests -v
      - name: Check Cloudflare proxy JavaScript syntax
        run: node --check "linkora/functions/api/engine/[[path]].js"
      - name: Check LINKORA frontend JavaScript syntax
        run: sed -n '/<script>/,/<\/script>/p' linkora/index.html | sed '1d;$d' | node --check
      - name: Build backend Docker image
        run: docker build -t linkora-backend-test ./linkora-backend
